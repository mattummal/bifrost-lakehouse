[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-lakehouse"
version = "0.1.0"
description = "Adaptive Compute Router & Medallion Lakehouse Control Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deltalake>=0.22.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "sqlglot>=25.0.0",
    "rich>=13.9.0",
    "soda-core>=3.3.20",
    "soda-core-duckdb>=3.3.20",
    "setuptools>=84.2.1",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
bifrost = "bifrost.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["bifrost"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
