[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bifrost-lakehouse"
version = "0.1.0"
description = "Adaptive Compute Router & Medallion Lakehouse Control Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deltalake>=0.22.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "sqlglot>=25.0.0",
    "rich>=13.9.0",
    "ruff>=0.17.1",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
bifrost = "bifrost.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bifrost"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
